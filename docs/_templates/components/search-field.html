{# A bootstrap-styled field that will direct to the `search.html` page when submitted #}
<form class="bd-search"
      action="{{ pathto('search') }}"
      method="get">
  <div class="d-flex align-items-center">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search"
           class="form-control"
           name="q"
           id="search-input"
           placeholder="{{ theme_search_bar_text }}"
           aria-label="{{ theme_search_bar_text }}"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"/>
    <span class="search-button__kbd-shortcut"><kbd class="kbd-shortcut__modifier">Ctrl</kbd>+<kbd>K</kbd></span>
  </div>
  <div class="d-flex visually-hidden">
    <label for="training">Filter by training</label>
  </div>
  <div class="d-flex">
    <select class="form-control" name="training" id="training" onchange="this.form.submit()">
      <option value="all">All documentation</option>
      {% for id, title in
        [
          ['admin-guide', 'Admin guide'],
          ['developer-guide', 'Developer guide'],
          ['deployment', 'Deployment'],
          ['volto', 'Volto UI'],
          ['classic-ui', 'Classic UI'],
          ['plone.restapi/docs/source', 'REST API'],
          ['backend', 'Backend'],
          ['i18n-l10n', 'Internationalization and Localization'],
          ['conceptual-guides', 'Conceptual guides'],
          ['contributing', 'Contributing to Plone'],
        ] %}
        <option value="{{id}}">{{ title }}</option>
      {% endfor %}
    </select>
  </div>
</form>
