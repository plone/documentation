{# A bootstrap-styled field that will direct to the `search.html` page when submitted #}
<form class="bd-search"
      action="{{ pathto('search') }}"
      method="get">
  <div class="d-flex align-items-center">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="search"
           class="form-control"
           name="q"
           id="search-input"
           placeholder="{{ theme_search_bar_text }}"
           aria-label="{{ theme_search_bar_text }}"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"/>
    <span class="search-button__kbd-shortcut"><kbd class="kbd-shortcut__modifier">Ctrl</kbd>+<kbd>K</kbd></span>
  </div>
  <div class="d-flex visually-hidden">
    <label for="section">Filter by section</label>
  </div>
  <div class="d-flex">
    <select class="form-control" name="section" id="section" onchange="this.form.submit()">
      <option value="all">all sections</option>
      {% for id, title in
        [
          ['admin-guide', 'Admin Guide'],
          ['backend', 'Backend'],
          ['classic-ui', 'Classic UI'],
          ['conceptual-guides', 'Conceptual Guides'],
          ['contributing', 'Contributing'],
          ['deployment', 'Deployment'],
          ['developer-guide', 'Developer Guide'],
          ['i18n-l10n', 'i18n/l10n'],
          ['install', 'Install'],
          ['overview', 'Overview'],
          ['reference-guide', 'Reference Guide'],
          ['training', 'Training'],
          ['upgrade', 'Upgrade'],
          ['user-guide', 'User Guide'],
          ['plone.restapi', 'Plone REST API'],
          ['plone.api', 'Plone API'],
          ['volto', 'Volto'],
        ] %}
        <option value="{{id}}">{{ title }}</option>
      {% endfor %}
    </select>
  </div>
</form>
